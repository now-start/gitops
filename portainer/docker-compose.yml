x-deploy-defaults: &deploy-defaults
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
    monitor: 5m
  rollback_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
    monitor: 5m
  restart_policy:
    condition: any
    delay: 5s

services:
  agent:
    stop_grace_period: 120s
    # Docker API versions differ; the entry point stays on 1.43 managers.
    image: portainer/agent:2.45.3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/@docker/volumes:/var/lib/docker/volumes
    deploy:
      <<: *deploy-defaults
      mode: global
      placement:
        constraints:
          - node.role == manager

  agent-worker:
    stop_grace_period: 120s
    # Do not publish ports: ingress can select the wrong Serf advertise IP.
    image: portainer/agent:2.45.3
    environment:
      AGENT_CLUSTER_ADDR: tasks.agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    deploy:
      <<: *deploy-defaults
      mode: global
      placement:
        constraints:
          - node.role == worker

  portainer:
    stop_grace_period: 120s
    image: portainer/portainer-ce:2.45.3
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    ports:
      - target: 9443
        published: 9443
        protocol: tcp
        mode: ingress
    volumes:
      - portainer_data:/data
    deploy:
      <<: *deploy-defaults
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  default:
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: "1200"

volumes:
  portainer_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=100.100.1.1,vers=4,hard
      device: :/volume1/docker/portainer

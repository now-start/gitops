services:
  flame:
    image: pawelmalak/flame:latest
    ports:
      - target: 5005
        published: 5005
        protocol: tcp
        mode: ingress
    environment:
      TZ: Asia/Seoul
      PASSWORD: ${FLAME_PASSWORD:-}
    volumes:
      - flame_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5005/', response => process.exit(response.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 3m
      rollback_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
        monitor: 3m
      restart_policy:
        condition: any
        delay: 5s

volumes:
  flame_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=10.8.0.1,vers=4,hard
      device: :/volume1/docker/flame

x-deploy-defaults: &deploy-defaults
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
    monitor: 5m
    delay: 10s
  rollback_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
    monitor: 5m
    delay: 10s
  restart_policy:
    condition: any
    delay: 5s

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 5m

x-service-defaults: &service-defaults
  stop_grace_period: 5m

services:
  flame:
    <<: *service-defaults
    image: pawelmalak/flame:2.4.0
    environment:
      TZ: Asia/Seoul
      PASSWORD: ${FLAME_PASSWORD:-}
    volumes:
      - flame_data:/app/data
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5005/', response => process.exit(response.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
    deploy:
      <<: *deploy-defaults
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.flame.rule=Host(`flame.nowstart.org`)
        - traefik.http.routers.flame.entrypoints=web
        - traefik.http.services.flame.loadbalancer.server.port=5005
      resources:
        limits:
          memory: 0.25G
        reservations:
          memory: 0.2G

# edge 스택이 생성하는 공개 서비스용 overlay. Traefik이 이 네트워크로 연결한다.
# 서비스가 하나뿐이라 스택 자체 네트워크를 두지 않는다.
networks:
  default:
    external: true
    name: edge_public

volumes:
  flame_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=100.100.1.1,vers=4,hard
      device: :/volume1/docker/flame

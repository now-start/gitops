x-deploy-defaults: &deploy-defaults
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
    monitor: 5m
    delay: 10s
  rollback_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
    monitor: 5m
    delay: 10s
  restart_policy:
    condition: any
    delay: 5s

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 5m

x-service-defaults: &service-defaults
  stop_grace_period: 5m

services:
  flame:
    <<: *service-defaults
    image: pawelmalak/flame:2.4.0
    ports:
      - target: 5005
        published: 5005
        protocol: tcp
        mode: ingress
    environment:
      TZ: Asia/Seoul
      PASSWORD: ${FLAME_PASSWORD:-}
    volumes:
      - flame_data:/app/data
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5005/', response => process.exit(response.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
    deploy:
      <<: *deploy-defaults
      replicas: 1
      resources:
        limits:
          memory: 0.25G
        reservations:
          memory: 0.25G

networks:
  default:
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: "1200"

volumes:
  flame_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=100.100.1.1,vers=4,hard
      device: :/volume1/docker/flame

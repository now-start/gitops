x-service-defaults: &service-defaults
  user: root
  environment:
    TZ: Asia/Seoul
    SPRING_CONFIG_IMPORT: configserver:http://config:8888
  networks:
    - default
    - grafana_default
  deploy:
    replicas: 1
    update_config:
      parallelism: 1
      order: stop-first
      failure_action: rollback
      monitor: 3m
    rollback_config:
      parallelism: 1
      order: stop-first
      failure_action: pause
      monitor: 3m
    restart_policy:
      condition: any
      delay: 5s

services:
  config:
    <<: *service-defaults
    image: ghcr.io/now-start/config:2.1.14
    environment:
      TZ: Asia/Seoul
      ENCRYPT_KEY: ${SPRING_ENCRYPT_KEY:-}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/

  eureka:
    <<: *service-defaults
    image: ghcr.io/now-start/eureka:2.4.9

  admin:
    <<: *service-defaults
    image: ghcr.io/now-start/admin:2.11.7

  gateway:
    <<: *service-defaults
    image: ghcr.io/now-start/gateway:6.1.0
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: ingress
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -XX:MaxDirectMemorySize=256m
      SPRING_CONFIG_IMPORT: configserver:http://config:8888

networks:
  default:
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: "1200"
  grafana_default:
    external: true

x-deploy-defaults: &deploy-defaults
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
    monitor: 5m
  rollback_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
    monitor: 5m
  restart_policy:
    condition: any
    delay: 5s

x-global-deploy-defaults: &global-deploy-defaults
  <<: *deploy-defaults
  mode: global

x-service-defaults: &service-defaults
  user: root
  healthcheck:
    test: ["CMD", "/workspace/health-check"]
    interval: 30s
    timeout: 30s
    retries: 3
    start_period: 120s
  environment:
    TZ: Asia/Seoul
    THC_PORT: "8081"
    THC_PATH: /actuator/health/liveness
    SPRING_CONFIG_IMPORT: configserver:http://config:8888
  networks:
    - default
    - grafana_default
  deploy:
    <<: *deploy-defaults
    mode: replicated
    replicas: 1

services:
  config:
    <<: *service-defaults
    image: ghcr.io/now-start/config:2.1.22
    deploy:
      <<: *global-deploy-defaults
    environment:
      TZ: Asia/Seoul
      THC_PORT: "8081"
      THC_PATH: /actuator/health/liveness
      ENCRYPT_KEY: ${SPRING_ENCRYPT_KEY:-}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/

  eureka:
    <<: *service-defaults
    image: ghcr.io/now-start/eureka:2.5.4
    deploy:
      <<: *global-deploy-defaults

  admin:
    <<: *service-defaults
    stop_grace_period: 120s
    image: ghcr.io/now-start/admin:2.11.19
    deploy:
      <<: *global-deploy-defaults
    environment:
      TZ: Asia/Seoul
      THC_PORT: "8081"
      THC_PATH: /actuator/health/liveness
      JAVA_TOOL_OPTIONS: -XX:MaxDirectMemorySize=256m
      SPRING_CONFIG_IMPORT: configserver:http://config:8888

  gateway:
    <<: *service-defaults
    image: ghcr.io/now-start/gateway:6.2.0
    deploy:
      <<: *global-deploy-defaults
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: ingress
    environment:
      TZ: Asia/Seoul
      THC_PORT: "8081"
      THC_PATH: /actuator/health/liveness
      JAVA_TOOL_OPTIONS: -XX:MaxDirectMemorySize=256m
      SPRING_CONFIG_IMPORT: configserver:http://config:8888

networks:
  default:
    driver: overlay
    ipam:
      config:
        - subnet: 10.0.11.0/24
    driver_opts:
      com.docker.network.driver.mtu: "1200"
  grafana_default:
    external: true

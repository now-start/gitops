x-deploy-defaults: &deploy-defaults
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
    monitor: 5m
    delay: 10s
  rollback_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
    monitor: 5m
    delay: 10s
  restart_policy:
    condition: any
    delay: 5s

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 5m

x-global-deploy-defaults: &global-deploy-defaults
  <<: *deploy-defaults
  mode: global
  placement:
    constraints:
      - node.role == manager

x-service-defaults: &service-defaults
  user: root
  stop_grace_period: 5m
  healthcheck:
    <<: *healthcheck-defaults
    test: ["CMD", "/workspace/health-check"]
  environment: &environment-defaults
    TZ: UTC
    THC_PORT: "8081"
    THC_PATH: /actuator/health/readiness
    SPRING_CONFIG_IMPORT: configserver:http://config:8888
  deploy:
    <<: *deploy-defaults
    mode: replicated
    replicas: 1

services:
  config:
    <<: *service-defaults
    image: ghcr.io/now-start/config:2.1.26
    deploy:
      <<: *global-deploy-defaults
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 0.75G
    environment:
      TZ: UTC
      THC_PORT: "8081"
      THC_PATH: /actuator/health/readiness
      ENCRYPT_KEY: ${SPRING_ENCRYPT_KEY:-}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/

  eureka:
    <<: *service-defaults
    image: ghcr.io/now-start/eureka:2.5.10
    deploy:
      <<: *global-deploy-defaults
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 0.55G

  admin:
    <<: *service-defaults
    image: ghcr.io/now-start/admin:2.11.29
    deploy:
      <<: *global-deploy-defaults
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 1.15G
    environment:
      <<: *environment-defaults
      JAVA_TOOL_OPTIONS: -XX:MaxDirectMemorySize=256m

  gateway:
    <<: *service-defaults
    image: ghcr.io/now-start/gateway:6.2.10
    # 내부 서비스와는 platform_default로, 공개는 edge_public으로 받는다.
    # HOSTNAME이 IPv4 두 개로 풀리므로 6.2.9부터 Config Server 기준으로 Hazelcast 주소를 고르고
    # 그 주소에만 바인딩한다(platform 저장소 docs/network-address-selection.md).
    networks:
      - default
      - edge
    deploy:
      <<: *global-deploy-defaults
      # 도메인(spring)이 스택 이름과 달라 Host 라벨을 유지한다.
      labels:
        - traefik.enable=true
        - traefik.http.routers.platform-gateway.rule=Host(`spring.nowstart.org`)
        - traefik.http.routers.platform-gateway.entrypoints=web
        - traefik.http.services.platform-gateway.loadbalancer.server.port=8000
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 0.9G
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: ingress
    environment:
      <<: *environment-defaults
      JAVA_TOOL_OPTIONS: -XX:MaxDirectMemorySize=256m

networks:
  default:
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: "1200"
  # edge 스택이 생성하는 공개 서비스용 overlay. gateway만 연결한다.
  edge:
    external: true
    name: edge_public

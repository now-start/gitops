x-deploy-defaults: &deploy-defaults
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
    monitor: 5m
    delay: 10s
  rollback_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
    monitor: 5m
    delay: 10s
  restart_policy:
    condition: any
    delay: 5s

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 5m

x-global-deploy-defaults: &global-deploy-defaults
  <<: *deploy-defaults
  mode: global
  placement:
    constraints:
      - node.role == manager

x-service-defaults: &service-defaults
  user: root
  stop_grace_period: 5m
  healthcheck:
    <<: *healthcheck-defaults
    test: ["CMD", "/workspace/health-check"]
  environment: &environment-defaults
    TZ: Asia/Seoul
    THC_PORT: "8081"
    THC_PATH: /actuator/health/readiness
    SPRING_CONFIG_IMPORT: configserver:http://config:8888
  deploy:
    <<: *deploy-defaults
    mode: replicated
    replicas: 1

services:
  config:
    <<: *service-defaults
    image: ghcr.io/now-start/config:2.1.25
    deploy:
      <<: *global-deploy-defaults
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 0.75G
    environment:
      TZ: Asia/Seoul
      THC_PORT: "8081"
      THC_PATH: /actuator/health/readiness
      ENCRYPT_KEY: ${SPRING_ENCRYPT_KEY:-}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/

  eureka:
    <<: *service-defaults
    image: ghcr.io/now-start/eureka:2.5.9
    deploy:
      <<: *global-deploy-defaults
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 0.55G

  admin:
    <<: *service-defaults
    image: ghcr.io/now-start/admin:2.11.28
    deploy:
      <<: *global-deploy-defaults
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 1.15G
    environment:
      <<: *environment-defaults
      JAVA_TOOL_OPTIONS: -XX:MaxDirectMemorySize=256m

  gateway:
    <<: *service-defaults
    image: ghcr.io/now-start/gateway:6.2.8
    deploy:
      <<: *global-deploy-defaults
      # edge 스택의 Traefik이 platform_default로 연결한다. 서비스 라벨만 바뀌면 태스크는 재시작되지 않는다.
      labels:
        - traefik.enable=true
        - traefik.swarm.network=platform_default
        - traefik.http.routers.platform-gateway.rule=Host(`spring.nowstart.org`)
        - traefik.http.routers.platform-gateway.entrypoints=web
        - traefik.http.services.platform-gateway.loadbalancer.server.port=8000
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 0.9G
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: ingress
    environment:
      <<: *environment-defaults
      JAVA_TOOL_OPTIONS: -XX:MaxDirectMemorySize=256m

networks:
  default:
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: "1200"

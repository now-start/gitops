x-deploy-defaults: &deploy-defaults
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
    monitor: 5m
    delay: 10s
  rollback_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
    monitor: 5m
    delay: 10s
  restart_policy:
    condition: any
    delay: 5s

x-service-defaults: &service-defaults
  stop_grace_period: 5m

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 5m

services:
  # Cloudflare Tunnel 커넥터. 매니저마다 Cloudflare로 바깥 방향 연결을 만들어
  # 공유기 포트포워딩·DDNS 없이 외부 요청을 받는다. 터널 route는
  # *.nowstart.org → http://edge_traefik:80 하나만 두고, 호스트별 라우팅은 Traefik이 맡는다.
  # edge_public에만 연결해 Traefik과 edge_public에 붙은 공개 서비스 외에는 닿지 않는다.
  # 이미지에 셸과 검사 도구가 없어 상태 검사를 두지 않는다.
  cloudflared:
    <<: *service-defaults
    image: cloudflare/cloudflared:2026.11.2
    command: tunnel --no-autoupdate run
    environment:
      TZ: Asia/Seoul
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    deploy:
      <<: *deploy-defaults
      mode: global
      resources:
        limits:
          memory: 0.25G
        reservations:
          memory: 0.1G
      placement:
        constraints:
          - node.role == manager

  # 클러스터 내부 라우터. 서비스의 deploy.labels를 읽어 Host별로 전달한다.
  # traefik.enable=true와 포트 라벨만 있으면 <스택 이름>.nowstart.org로 공개하고 web 진입점을 쓴다.
  # 다른 호스트 이름이 필요하면 router rule 라벨로 덮어쓴다.
  # TLS는 Cloudflare 엣지에서 끝나므로 내부는 HTTP(:80)만 받고 포트를 공개하지 않는다.
  # Swarm API는 socket-proxy를 거쳐 조회만 한다. Docker 소켓을 직접 마운트하지 않는다.
  # 공개 서비스는 모두 edge_public에서 찾는다. DB 등 platform_default의 내부 서비스에는 닿지 않으며,
  # edge는 다른 스택의 네트워크에 의존하지 않는다.
  # X-Forwarded-*는 Swarm overlay 기본 대역(10.0.0.0/8)에서 온 요청만 신뢰한다.
  traefik:
    <<: *service-defaults
    image: traefik:3.8.0
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --providers.swarm.endpoint=tcp://socket-proxy:2375
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=edge_public
      - '--providers.swarm.defaultRule=Host(`{{ index .Labels "com.docker.stack.namespace" }}.nowstart.org`)'
      - --entrypoints.web.address=:80
      - --entrypoints.web.asDefault=true
      - --entrypoints.web.forwardedHeaders.trustedIPs=10.0.0.0/8
      - --entrypoints.web.http.aliasHeadersStrategy=delete
      - --api.dashboard=true
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
    environment:
      TZ: Asia/Seoul
    networks:
      - default
      - socket
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "traefik", "healthcheck", "--ping"]
    deploy:
      <<: *deploy-defaults
      mode: global
      # 관리 화면과 API 모두 Synology SSO의 administrators 그룹만 허용한다.
      # Swarm은 포트를 자동으로 찾지 못해 서비스 포트 라벨이 필요하므로 사용하지 않는 값(9999)을 둔다.
      labels:
        - traefik.enable=true
        - traefik.http.routers.traefik-dashboard.rule=Host(`traefik.nowstart.org`)
        - traefik.http.routers.traefik-dashboard.service=api@internal
        - traefik.http.routers.traefik-dashboard.middlewares=traefik-dashboard-auth
        - traefik.http.middlewares.traefik-dashboard-auth.forwardauth.address=http://oauth2-proxy:4180/
        - traefik.http.middlewares.traefik-dashboard-auth.forwardauth.trustForwardHeader=true
        - traefik.http.middlewares.traefik-dashboard-auth.forwardauth.addAuthCookiesToResponse=__Host-traefik_sso
        - traefik.http.services.traefik-dashboard.loadbalancer.server.port=9999
      resources:
        limits:
          memory: 0.25G
        reservations:
          memory: 0.1G
      placement:
        constraints:
          - node.role == manager

  # 인증 성공 시 static://202로 ForwardAuth를 통과시킨다. 실패 시 접근을 차단한다.
  # /oauth2/만 인증 없이 이 서비스로 보내 로그인/콜백의 인증 루프를 피한다.
  oauth2-proxy:
    <<: *service-defaults
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    command:
      - --http-address=0.0.0.0:4180
      - --provider=oidc
      - --provider-display-name=Synology SSO
      - --oidc-issuer-url=https://sso.nowstart.org/webman/sso
      - --scope=openid email groups
      - --oidc-groups-claim=groups
      - --allowed-group=administrators
      - --email-domain=*
      # Synology는 email_verified claim을 제공하지 않는다. 권한은 서명 검증된 groups로 제한한다.
      - --insecure-oidc-allow-unverified-email=true
      - --insecure-oidc-skip-nonce=false
      - --code-challenge-method=S256
      - --redirect-url=https://traefik.nowstart.org/oauth2/callback
      - --whitelist-domain=traefik.nowstart.org
      - --reverse-proxy=true
      - --trusted-proxy-ip=10.0.0.0/8
      - --upstream=static://202
      - --skip-provider-button=true
      - --cookie-name=__Host-traefik_sso
      - --cookie-secure=true
      - --cookie-httponly=true
      - --cookie-samesite=lax
      - --cookie-expire=1h
      - --request-logging=false
    environment:
      TZ: Asia/Seoul
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?OAUTH2_PROXY_CLIENT_ID is required}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?OAUTH2_PROXY_CLIENT_SECRET is required}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?OAUTH2_PROXY_COOKIE_SECRET is required}
    networks:
      - default
    deploy:
      <<: *deploy-defaults
      mode: global
      labels:
        - traefik.enable=true
        - traefik.http.routers.traefik-sso.rule=Host(`traefik.nowstart.org`) && PathPrefix(`/oauth2/`)
        - traefik.http.routers.traefik-sso.priority=100
        - traefik.http.routers.traefik-sso.service=traefik-sso
        - traefik.http.services.traefik-sso.loadbalancer.server.port=4180
      resources:
        limits:
          memory: 0.25G
        reservations:
          memory: 0.1G
      placement:
        constraints:
          - node.role == manager

  # Traefik 전용 Docker API 프록시. GET·HEAD만 허용하고(POST=0 기본값),
  # Traefik swarm provider가 쓰는 버전·서비스·태스크·네트워크·노드 조회만 연다.
  # Swarm API는 매니저에만 있으므로 매니저에서 실행하며, 내부 전용 socket 네트워크에만 연결한다.
  # 요청마다 남는 접근 로그를 줄이려고 warning 이상만 기록한다.
  socket-proxy:
    <<: *service-defaults
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      TZ: Asia/Seoul
      LOG_LEVEL: warning
      EVENTS: "0"
      NETWORKS: "1"
      NODES: "1"
      SERVICES: "1"
      TASKS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket
    healthcheck:
      <<: *healthcheck-defaults
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
    deploy:
      <<: *deploy-defaults
      mode: global
      resources:
        limits:
          memory: 0.1G
        reservations:
          memory: 0.05G
      placement:
        constraints:
          - node.role == manager

networks:
  # 공개 서비스용 overlay. edge 뒤에 배포되는 스택은 이 네트워크를 external로 연결한다.
  # 스택 이름과 상관없이 같은 이름을 쓰도록 이름을 고정한다.
  default:
    name: edge_public
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: "1200"
  socket:
    driver: overlay
    internal: true
    driver_opts:
      com.docker.network.driver.mtu: "1200"

x-deploy-defaults: &deploy-defaults
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
    monitor: 5m
  rollback_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
    monitor: 5m
  restart_policy:
    condition: any
    delay: 5s

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 5m

x-service-defaults: &service-defaults
  stop_grace_period: 5m

services:
  nyang-nyang-bot:
    image: ghcr.io/now-start/nyang-nyang-bot:5.9.11
    user: root
    <<: *service-defaults
    environment:
      TZ: Asia/Seoul
      THC_PORT: "8081"
      THC_PATH: /actuator/health/readiness
      SPRING_CONFIG_IMPORT: configserver:http://config:8888
    volumes:
      - chzzk_data:/workspace/key
    networks:
      - platform_default
      - grafana_default
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/workspace/health-check"]
    deploy:
      <<: *deploy-defaults
      replicas: 1

volumes:
  chzzk_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=100.100.1.1,vers=4,hard
      device: :/volume1/docker/chzzk

networks:
  platform_default:
    external: true
  grafana_default:
    external: true

x-deploy-defaults: &deploy-defaults
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
    monitor: 5m
    delay: 10s
  rollback_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
    monitor: 5m
    delay: 10s
  restart_policy:
    condition: any
    delay: 5s

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 5m

x-service-defaults: &service-defaults
  stop_grace_period: 5m

services:
  nyang-nyang-bot:
    image: ghcr.io/now-start/nyang-nyang-bot:6.0.2
    user: root
    <<: *service-defaults
    environment:
      TZ: UTC
      THC_PORT: "8081"
      THC_PATH: /actuator/health/readiness
      SPRING_CONFIG_IMPORT: configserver:http://config:8888
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/workspace/health-check"]
    deploy:
      <<: *deploy-defaults
      replicas: 1
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 0.75G

networks:
  default:
    external: true
    name: platform_default

x-deploy-defaults: &deploy-defaults
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
    monitor: 5m
    delay: 10s
  rollback_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
    monitor: 5m
    delay: 10s
  restart_policy:
    condition: any
    delay: 5s

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 5m

x-service-defaults: &service-defaults
  stop_grace_period: 5m

services:
  nyang-nyang-bot:
    image: ghcr.io/now-start/nyang-nyang-bot:5.9.11
    user: root
    <<: *service-defaults
    environment:
      TZ: Asia/Seoul
      THC_PORT: "8081"
      THC_PATH: /actuator/health/readiness
      SPRING_CONFIG_IMPORT: configserver:http://config:8888
    # Google 서비스 계정 키. 중앙 설정의 google.spreadsheet.key가 이 경로를 가리킨다.
    # Docker secret은 매니저 raft에 복제되므로 main NFS가 중단되어도 태스크를 다시 띄울 수 있다.
    secrets:
      - source: chzzk_google_sheet_key
        target: /run/secrets/google-sheet-key.json
        mode: 0400
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/workspace/health-check"]
    deploy:
      <<: *deploy-defaults
      replicas: 1
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 0.75G

# 배포 전에 매니저에서 직접 만든다(README의 chzzk 절 참고). 값은 Git에 두지 않는다.
secrets:
  chzzk_google_sheet_key:
    external: true

networks:
  default:
    external: true
    name: platform_default

services:
  nyang-nyang-bot:
    image: ghcr.io/now-start/nyang-nyang-bot:latest
    user: root
    environment:
      TZ: Asia/Seoul
      SPRING_CONFIG_IMPORT: configserver:http://config:8888
    volumes:
      - chzzk_data:/workspace/key
    networks:
      - spring_default
      - grafana_default
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s

volumes:
  chzzk_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=10.8.0.1,vers=4,hard
      device: :/volume1/docker/chzzk

networks:
  spring_default:
    external: true
  grafana_default:
    external: true

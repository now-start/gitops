x-deploy-defaults: &deploy-defaults
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
    monitor: 5m
    delay: 10s
  rollback_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
    monitor: 5m
    delay: 10s
  restart_policy:
    condition: any
    delay: 5s

x-service-defaults: &service-defaults
  stop_grace_period: 5m

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 5m

services:
  app:
    <<: *service-defaults
    image: REPLACE_IMAGE:0.0.0
    # 서비스에 필요한 설정만 주석을 해제해 사용합니다.
    # ports:
    #   - target: 8080
    #     published: 8080
    #     protocol: tcp
    #     mode: ingress
    # environment:
    #   TZ: Asia/Seoul
    #   # Spring/Paketo 상태 검사 환경변수
    #   THC_PORT: "8081"
    #   THC_PATH: /actuator/health/readiness
    #   APP_SECRET: ${APP_SECRET:-}
    volumes:
      - app_data:/data
    # 상태 검사 명령을 제공하는 모든 이미지에서 활성화할 수 있습니다.
    # 이미지가 지원하는 검사 명령을 사용합니다. 아래는 Spring/Paketo 예제입니다.
    # healthcheck:
    #   <<: *healthcheck-defaults
    #   test: ["CMD", "/workspace/health-check"]
    deploy:
      <<: *deploy-defaults
      mode: replicated
      replicas: 1
      # 노드마다 하나씩 실행하려면 mode: global로 변경하고 replicas를 제거합니다.

networks:
  default:
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: "1200"

volumes:
  app_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=100.100.1.1,vers=4,hard
      device: :/volume1/docker/app

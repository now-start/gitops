services:
  bitwarden:
    image: ${BITWARDEN_IMAGE:-vaultwarden/server}:${BITWARDEN_TAG:-latest}
    ports:
      - target: 80
        published: ${BITWARDEN_PORT:-1080}
        protocol: tcp
        mode: ingress
    environment:
      TZ: ${TZ:-Asia/Seoul}
      DOMAIN: ${BITWARDEN_DOMAIN:-https://bitwarden.nowstart.org}
      SSO_ENABLED: "true"
      SSO_ONLY: "true"
      SSO_AUTH_ONLY_NOT_SESSION: "true"
      SSO_AUTHORITY: ${BITWARDEN_SSO_AUTHORITY:-https://sso.nowstart.org/webman/sso}
      SSO_CLIENT_ID: ${BITWARDEN_SSO_CLIENT_ID:?Set BITWARDEN_SSO_CLIENT_ID in Arcane}
      SSO_CLIENT_SECRET: ${BITWARDEN_SSO_CLIENT_SECRET:?Set BITWARDEN_SSO_CLIENT_SECRET in Arcane}
    volumes:
      - bitwarden_data:/data
    deploy:
      replicas: ${BITWARDEN_REPLICAS:-1}
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s

volumes:
  bitwarden_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_ADDRESS:-10.8.0.1},vers=4,hard
      device: :${BITWARDEN_NFS_PATH:-/volume1/docker/bitwarden}

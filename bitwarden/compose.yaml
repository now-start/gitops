services:
  bitwarden:
    image: vaultwarden/server:latest
    ports:
      - target: 80
        published: 1080
        protocol: tcp
        mode: ingress
    environment:
      TZ: Asia/Seoul
      DOMAIN: https://bitwarden.nowstart.org
      SSO_ENABLED: "true"
      SSO_ONLY: "true"
      SSO_AUTH_ONLY_NOT_SESSION: "true"
      SSO_AUTHORITY: https://sso.nowstart.org/webman/sso
      SSO_CLIENT_ID: "1db429ff8c99accb53cdf5d989e70c91"
      SSO_CLIENT_SECRET: ${BITWARDEN_SSO_CLIENT_SECRET:-}
    volumes:
      - bitwarden_data:/data
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s

volumes:
  bitwarden_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=10.8.0.1,vers=4,hard
      device: :/volume1/docker/bitwarden

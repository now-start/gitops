x-deploy-defaults: &deploy-defaults
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
    monitor: 5m
    delay: 10s
  rollback_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
    monitor: 5m
    delay: 10s
  restart_policy:
    condition: any
    delay: 5s

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 5m

x-service-defaults: &service-defaults
  stop_grace_period: 5m

services:
  bitwarden:
    <<: *service-defaults
    image: vaultwarden/server:1.37.5
    environment:
      TZ: Asia/Seoul
      DOMAIN: https://bitwarden.nowstart.org
      SSO_ENABLED: "true"
      SSO_ONLY: "true"
      SSO_AUTH_ONLY_NOT_SESSION: "true"
      SSO_AUTHORITY: https://sso.nowstart.org/webman/sso
      SSO_CLIENT_ID: "1db429ff8c99accb53cdf5d989e70c91"
      SSO_CLIENT_SECRET: ${BITWARDEN_SSO_CLIENT_SECRET:-}
    volumes:
      - bitwarden_data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/healthcheck.sh"]
    deploy:
      <<: *deploy-defaults
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.services.bitwarden.loadbalancer.server.port=80
      resources:
        limits:
          memory: 0.25G
        reservations:
          memory: 0.15G

# edge 스택이 생성하는 공개 서비스용 overlay. Traefik이 이 네트워크로 연결한다.
# 서비스가 하나뿐이라 스택 자체 네트워크를 두지 않는다.
networks:
  default:
    external: true
    name: edge_public

volumes:
  bitwarden_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=100.100.1.1,vers=4,hard
      device: :/volume1/docker/bitwarden

services:
  cockroachdb:
    image: cockroachdb/cockroach:v26.3.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cockroach start --insecure \
          --store=/data \
          --listen-addr=0.0.0.0:26257 \
          --http-addr=0.0.0.0:8080 \
          --advertise-addr="$$(hostname -i):26257" \
          --join=tasks.cockroachdb:26257 &
        cockroach_pid=$$!
        trap 'kill -TERM "$$cockroach_pid"; wait "$$cockroach_pid"' INT TERM

        while ! cockroach node status --insecure --host=127.0.0.1:26257 >/dev/null 2>&1; do
          if ! kill -0 "$$cockroach_pid" 2>/dev/null; then
            wait "$$cockroach_pid" || exit $$?
            exit 1
          fi
          cockroach init --insecure --host=127.0.0.1:26257 >/dev/null 2>&1 || true
          sleep 1
        done
        wait "$$cockroach_pid"
    ports:
      - target: 26257
        published: 26257
        protocol: tcp
        mode: host
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host
    environment:
      TZ: Asia/Seoul
    volumes:
      - cockroachdb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cockroach sql --insecure -e 'select 1' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      mode: global
      endpoint_mode: dnsrr
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 3m
      rollback_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
        monitor: 3m
      restart_policy:
        condition: any
        delay: 5s

networks:
  default:
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: "1200"

volumes:
  cockroachdb_data:
    driver: local

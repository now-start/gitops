name: Reusable Java Test

on:
  workflow_call:
    inputs:
      java-version:
        description: "Java version (if not specified, it will be detected from build.gradle)"
        required: false
        type: string
      distribution:
        description: "JDK distribution"
        required: false
        type: string
        default: "temurin"
      module:
        description: "Gradle submodule name (e.g., config-service). Empty for single-module projects."
        required: false
        type: string
        default: ""

    outputs:
      coverage-available:
        description: "Whether a coverage badge artifact was generated"
        value: ${{ jobs.test.outputs.coverage-available }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      coverage-available: ${{ steps.coverage.outputs.available }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate module name
        if: ${{ inputs.module != '' }}
        env:
          MODULE: ${{ inputs.module }}
        run: |
          if [[ ! "$MODULE" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "❌ Error: Invalid module name '$MODULE'. Only alphanumeric, dash, underscore, and dot are allowed."
            exit 1
          fi

      - name: Detect Java version
        id: java-info
        env:
          INPUT_JAVA_VERSION: ${{ inputs.java-version }}
          MODULE: ${{ inputs.module }}
        run: |
          if [ -n "$INPUT_JAVA_VERSION" ]; then
            VERSION="$INPUT_JAVA_VERSION"
          else
            BUILD_FILES=()
            if [ -n "$MODULE" ]; then
              BUILD_FILES+=("$MODULE/build.gradle" "$MODULE/build.gradle.kts")
            fi
            BUILD_FILES+=("build.gradle" "build.gradle.kts")
            VERSION=''
            for BUILD_FILE in "${BUILD_FILES[@]}"; do
              [ -f "$BUILD_FILE" ] || continue
              VERSION=$(grep -Eo 'JavaLanguageVersion\.of\([0-9]+\)' "$BUILD_FILE" | head -1 | sed -E 's/[^0-9]//g' || true)
              VERSION=${VERSION:-$(grep -Eo "(source|target)Compatibility[[:space:]]*=[[:space:]]*['\"]?[0-9]+(\.[0-9]+)?['\"]?" "$BUILD_FILE" | head -1 | sed -E 's/[^0-9.]//g' || true)}
              VERSION=${VERSION:-$(grep -Eo 'JavaVersion\.VERSION_[0-9]+(_[0-9]+)?' "$BUILD_FILE" | head -1 | sed -E 's/JavaVersion\.VERSION_//; s/_/./g' || true)}
              VERSION=${VERSION#1.}
              [ -z "$VERSION" ] || break
            done
          fi
          if [ -z "$VERSION" ]; then
            echo 'Could not detect Java version; provide the java-version input' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using Java version: $VERSION"

      - name: Set up JDK ${{ steps.java-info.outputs.version }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: ${{ steps.java-info.outputs.version }}
          distribution: ${{ inputs.distribution }}
          cache: "gradle"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and test
        env:
          MODULE: ${{ inputs.module }}
        run: |
          GRADLE_TASK="${MODULE:+:$MODULE:}build"
          ./gradlew "$GRADLE_TASK" --build-cache --parallel -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Collect JaCoCo coverage
        id: coverage
        env:
          MODULE: ${{ inputs.module }}
        run: |
          python3 <<'PYTHON'
          """JaCoCo 전체 보고서에서 라인 커버리지 배지와 측정 근거를 만든다."""

          import os
          import json
          import math
          from pathlib import Path
          import xml.etree.ElementTree as ET


          def generate(report: Path, output: Path, revision: str):
              root = ET.parse(report).getroot()
              # 패키지·클래스별 수치를 다시 더하면 중복되므로 보고서 최상위 집계만 읽는다.
              counter = root.find("./counter[@type='LINE']")
              if counter is None:
                  raise ValueError("보고서에 전체 LINE 집계가 없습니다.")
              covered = int(counter.attrib["covered"])
              missed = int(counter.attrib["missed"])
              if min(covered, missed) < 0 or covered + missed == 0:
                  raise ValueError("측정할 코드가 없거나 집계가 잘못되었습니다.")
              # 반올림으로 100%처럼 보이지 않도록 소수 첫째 자리에서 버림한다.
              percent = math.floor(covered * 1000 / (covered + missed)) / 10
              label = f"{percent:.1f}%"
              color = "#4c1" if percent >= 80 else "#dfb317" if percent >= 60 else "#e05d44"
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="150" height="20" role="img" aria-label="JaCoCo lines: {label}">
            <title>JaCoCo lines: {label}</title>
            <rect width="150" height="20" rx="3" fill="{color}"/>
            <path fill="#555" d="M3 0h91v20H3a3 3 0 0 1-3-3V3a3 3 0 0 1 3-3"/>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11">
              <text x="47" y="14">JaCoCo lines</text><text x="122" y="14">{label}</text>
            </g>
          </svg>
          '''
              output.mkdir(parents=True, exist_ok=True)
              (output / "jacoco.svg").write_text(svg, encoding="utf-8")
              branch = root.find("./counter[@type='BRANCH']")
              bc = int(branch.get("covered", "0")) if branch is not None else 0
              bm = int(branch.get("missed", "0")) if branch is not None else 0
              if min(bc, bm) < 0:
                  raise ValueError("분기 집계가 잘못되었습니다.")
              branch_percent = math.floor(bc * 1000 / (bc + bm)) / 10 if bc + bm else None
              branch_label = f"{branch_percent:.1f}%" if branch_percent is not None else "n/a"
              branch_color = "#9f9f9f" if branch_percent is None else "#4c1" if branch_percent >= 80 else "#dfb317" if branch_percent >= 60 else "#e05d44"
              branch_svg = svg.replace("JaCoCo lines", "JaCoCo branch").replace(label, branch_label).replace(color, branch_color)
              (output / "jacoco-branches.svg").write_text(branch_svg, encoding="utf-8")
              summary = dict(covered=covered, missed=missed, total=covered + missed,
                             line_percent=percent, branch_percent=branch_percent, branch_covered=bc, branch_missed=bm, source_sha=revision, scope=report.as_posix())
              (output / "summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(f"전체 라인 커버리지: {label} ({covered}/{covered + missed}), 기준 커밋: {revision}")


          def main():
              base = Path(os.environ.get("MODULE") or ".")
              reports = sorted((base / "build/reports/jacoco").glob("**/*.xml"))
              aggregate = base / "build/reports/jacoco/root/jacoco.xml"
              if aggregate in reports:
                  report = aggregate
              elif len(reports) == 1:
                  report = reports[0]
              else:
                  print("No unique project-level JaCoCo XML report; skipping badge.")
                  return
              output = Path("build/reports/coverage-badge")
              generate(report, output, os.environ["GITHUB_SHA"])
              with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
                  stream.write("available=true\n")
              data = json.loads((output / "summary.json").read_text(encoding="utf-8"))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
                  stream.write(f"### JaCoCo\n- Report: `{report}`\n- Lines: {data['line_percent']}%\n- Branches: {data['branch_percent']}\n")

          if __name__ == "__main__":
              main()
          PYTHON

      - name: Upload JaCoCo reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-coverage-${{ inputs.module || 'root' }}
          path: ${{ inputs.module || '.' }}/**/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload coverage badges
        if: steps.coverage.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-badge-${{ inputs.module || 'root' }}
          path: build/reports/coverage-badge/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "### 🧪 Test Result"
            echo "- **Java**: \`${{ steps.java-info.outputs.version }}\`"
            echo "- **Status**: ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}"
          } >> "$GITHUB_STEP_SUMMARY"

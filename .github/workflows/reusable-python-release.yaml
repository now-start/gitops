name: Reusable Python Release

on:
  workflow_call:
    inputs:
      version:
        description: Project SemVer
        required: true
        type: string
      prerelease:
        description: Whether to publish a GitHub prerelease
        type: string
        default: 'false'
      source-sha:
        description: Commit that the Git tag must reference
        required: true
        type: string
    secrets:
      github-token:
        description: GitHub token for viewing and creating releases
        required: true

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/reusable-release.yaml
    with:
      tag-name: ${{ inputs.version }}
      prerelease: ${{ inputs.prerelease }}
      source-sha: ${{ inputs.source-sha }}
    secrets:
      github-token: ${{ secrets.github-token }}

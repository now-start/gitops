name: Reusable Java Docker Image

on:
  workflow_call:
    inputs:
      registry-org:
        description: 'Registry organization/namespace (e.g., ghcr.io/now-start)'
        required: false
        type: string
        default: 'ghcr.io/now-start'
      version:
        description: 'Project version (e.g., 1.2.3)'
        required: true
        type: string
      java-version:
        description: 'Java version for bootBuildImage'
        required: true
        type: string
      module:
        description: 'Gradle submodule name (e.g., config-service). Empty for single-module projects.'
        required: false
        type: string
        default: ''
      source-sha:
        description: 'Commit that must own the immutable image tag'
        required: true
        type: string
      tag-exists:
        description: 'Whether the matching Git tag already exists'
        required: true
        type: string
    secrets:
      registry-password:
        description: 'Registry password/token'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Validate module name
        if: ${{ inputs.module != '' }}
        env:
          MODULE: ${{ inputs.module }}
        run: |
          if [[ ! "$MODULE" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "❌ Error: Invalid module name '$MODULE'. Only alphanumeric, dash, underscore, and dot are allowed."
            exit 1
          fi

      - name: Resolve image name
        env:
          MODULE: ${{ inputs.module }}
          REGISTRY_ORG: ${{ inputs.registry-org }}
        run: |
          SERVICE_NAME="${MODULE:-${{ github.event.repository.name }}}"
          IMAGE_NAME="$REGISTRY_ORG/$SERVICE_NAME"

          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Build and Push Docker image
        env:
          REGISTRY_PASSWORD: ${{ secrets.registry-password }}
          VERSION: ${{ inputs.version }}
          MODULE: ${{ inputs.module }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          TAG_EXISTS: ${{ inputs.tag-exists }}
        run: |
          GRADLE_TASK="${MODULE:+:$MODULE:}bootBuildImage"
          REGISTRY_HOST="${IMAGE_NAME%%/*}"

          echo "🔐 Logging in to $REGISTRY_HOST"
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u ${{ github.actor }} --password-stdin

          set +e
          MANIFEST_OUTPUT=$(docker manifest inspect "$IMAGE_NAME:$VERSION" 2>&1)
          MANIFEST_STATUS=$?
          set -e

          if [ "$MANIFEST_STATUS" -eq 0 ]; then
            REMOTE_REVISION=$(docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" \
              --format '{{json .Image.Config.Labels}}' \
              | jq -r '.["org.opencontainers.image.revision"] // empty')
            if [ "$REMOTE_REVISION" != "$SOURCE_SHA" ]; then
              echo "❌ Existing image $IMAGE_NAME:$VERSION belongs to revision '${REMOTE_REVISION:-unknown}', expected $SOURCE_SHA"
              exit 1
            fi

            echo "✅ Reusing immutable image: $IMAGE_NAME:$VERSION ($SOURCE_SHA)"
            {
              echo "### 🐳 Docker Images"
              echo "- \`$IMAGE_NAME:$VERSION\` (existing image reused)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! grep -qiE 'manifest unknown|no such manifest|manifest.*not found' <<< "$MANIFEST_OUTPUT"; then
            echo "❌ Could not verify whether $IMAGE_NAME:$VERSION exists"
            echo "$MANIFEST_OUTPUT"
            exit 1
          fi

          if [ "$TAG_EXISTS" = "true" ]; then
            echo "❌ Git tag already exists but immutable image is missing: $IMAGE_NAME:$VERSION"
            exit 1
          fi

          echo "🏗️ Building Docker image: $IMAGE_NAME:$VERSION"
          ./gradlew "$GRADLE_TASK" \
            --imageName="$IMAGE_NAME:$VERSION" \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx2g" \
            --environment "BP_OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}" \
            --environment "BP_OCI_REVISION=$SOURCE_SHA"

          LOCAL_REVISION=$(docker image inspect "$IMAGE_NAME:$VERSION" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          if [ "$LOCAL_REVISION" != "$SOURCE_SHA" ]; then
            echo "❌ Built image revision '$LOCAL_REVISION' does not match $SOURCE_SHA"
            exit 1
          fi

          echo "🚀 Pushing immutable version image"
          docker push "$IMAGE_NAME:$VERSION"

          {
            echo "### 🐳 Docker Images"
            echo "- \`$IMAGE_NAME:$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [ -z "$IMAGE_NAME" ] && exit 0
          docker rmi "$IMAGE_NAME:$VERSION" || true
          docker builder prune -af || true

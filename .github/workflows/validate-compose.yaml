name: Validate Compose

on:
  pull_request:
    paths:
      - "**/docker-compose.yml"
      - ".github/workflows/validate-compose.yaml"
  push:
    branches: [main]
    paths:
      - "**/docker-compose.yml"
      - ".github/workflows/validate-compose.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      BITWARDEN_SSO_CLIENT_SECRET: test
      FLAME_PASSWORD: test
      GRAFANA_OAUTH_CLIENT_SECRET: test
      GRAFANA_SMTP_PASSWORD: test
      REDIS_PASSWORD: test
      SPRING_ENCRYPT_KEY: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Render all Swarm stacks
        shell: bash
        run: |
          set -euo pipefail

          compose_files=(
            bitwarden/docker-compose.yml
            chzzk/docker-compose.yml
            evergreen/docker-compose.yml
            flame/docker-compose.yml
            grafana/docker-compose.yml
            platform/docker-compose.yml
            portainer/docker-compose.yml
            redis/docker-compose.yml
            renovate/docker-compose.yml
          )

          for compose_file in "${compose_files[@]}"; do
            echo "Validating $compose_file"
            docker stack config -c "$compose_file" >/dev/null
          done

name: Reusable Python Test

on:
  workflow_call:
    inputs:
      uv-version:
        description: uv version used for dependency installation and checks
        type: string
        default: '0.11.3'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check .

      - name: Type check
        run: uv run --locked mypy

      - name: Test
        run: uv run --locked pytest

      - name: Audit dependencies
        run: uv run --locked pip-audit

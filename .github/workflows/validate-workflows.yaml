name: Validate Workflows

on:
  pull_request:
    paths:
      - ".github/actionlint.yaml"
      - ".github/workflows/**"
      - "tests/**"
      - "examples/**"
      - "renovate.json"
  push:
    branches: [main]
    paths:
      - ".github/actionlint.yaml"
      - ".github/workflows/**"
      - "tests/**"
      - "examples/**"
      - "renovate.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats ruby jq
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate workflows and release contracts
        run: bash tests/run_tests.sh

      # Renovate builder PRs must not reintroduce a single-architecture index.
      - name: Verify Java builder platforms
        run: |
          set -euo pipefail
          IMAGE=$(ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("env").fetch("PAKETO_BUILDER_IMAGE")' .github/workflows/reusable-java-docker.yaml)
          PLATFORMS=$(docker buildx imagetools inspect --raw "$IMAGE" | jq -c '[.manifests[]?.platform | "\(.os)/\(.architecture)"] | unique')
          echo "$IMAGE -> $PLATFORMS"
          if ! jq -e '(["linux/amd64", "linux/arm64"] - .) == []' <<< "$PLATFORMS" > /dev/null; then
            echo "::error::$IMAGE must publish linux/amd64 and linux/arm64"
            exit 1
          fi

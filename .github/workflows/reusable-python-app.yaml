name: Reusable Python App Orchestrator

on:
  workflow_call:
    inputs:
      uv-version:
        description: uv version used for dependency installation and checks
        type: string
        default: '0.11.3'
    secrets:
      registry-password:
        description: GHCR password/token
        required: true

concurrency:
  group: ${{ github.repository }}-root-${{ github.event_name }}-${{ github.ref }}-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-only:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    uses: ./.github/workflows/reusable-python-test.yaml
    with:
      uv-version: ${{ inputs.uv-version }}

  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-python-prepare.yaml

  build:
    if: needs.prepare.outputs.tag-exists == 'false'
    needs: prepare
    uses: ./.github/workflows/reusable-python-test.yaml
    with:
      uv-version: ${{ inputs.uv-version }}

  docker:
    if: needs.prepare.outputs.tag-exists == 'false'
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-python-docker.yaml
    with:
      version: ${{ needs.prepare.outputs.version }}
      image: ${{ needs.prepare.outputs.image }}
      source-sha: ${{ needs.prepare.outputs.source-sha }}
      tag-exists: ${{ needs.prepare.outputs.tag-exists }}
    secrets:
      registry-password: ${{ secrets.registry-password }}

  release:
    if: needs.prepare.outputs.tag-exists == 'false'
    needs: [prepare, docker]
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-python-release.yaml
    with:
      version: ${{ needs.prepare.outputs.version }}
      prerelease: ${{ needs.prepare.outputs.prerelease }}
      source-sha: ${{ needs.prepare.outputs.source-sha }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

name: Reusable Java Prepare

on:
  workflow_call:
    inputs:
      java-version:
        description: Explicit JDK version, empty for automatic detection
        type: string
        default: ""
      module:
        description: Gradle submodule name, empty for a single-module project
        type: string
        default: ""
    outputs:
      version:
        description: Validated project SemVer
        value: ${{ jobs.policy.outputs.version }}
      tag-name:
        description: Git tag including optional module prefix
        value: ${{ jobs.policy.outputs.tag-name }}
      prerelease:
        description: Whether this is an alpha, beta, or RC release
        value: ${{ jobs.policy.outputs.prerelease }}
      source-sha:
        description: Commit associated with the version
        value: ${{ jobs.policy.outputs.source-sha }}
      tag-exists:
        description: Whether the version Git tag exists
        value: ${{ jobs.policy.outputs.tag-exists }}
      release-exists:
        description: Whether a matching published release exists
        value: ${{ jobs.policy.outputs.release-exists }}
      java-version:
        description: Detected Java version
        value: ${{ jobs.metadata.outputs.java-version }}

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      java-version: ${{ steps.java-info.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate module name
        if: ${{ inputs.module != '' }}
        env:
          MODULE: ${{ inputs.module }}
        run: |
          if [[ ! "$MODULE" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "❌ Error: Invalid module name '$MODULE'. Only alphanumeric, dash, underscore, and dot are allowed."
            exit 1
          fi

      - name: Detect Java version
        id: java-info
        env:
          INPUT_JAVA_VERSION: ${{ inputs.java-version }}
          MODULE: ${{ inputs.module }}
        run: |
          if [ -n "$INPUT_JAVA_VERSION" ]; then
            VERSION="$INPUT_JAVA_VERSION"
          else
            BUILD_FILES=()
            if [ -n "$MODULE" ]; then
              BUILD_FILES+=("$MODULE/build.gradle" "$MODULE/build.gradle.kts")
            fi
            BUILD_FILES+=("build.gradle" "build.gradle.kts")
            VERSION=''
            for BUILD_FILE in "${BUILD_FILES[@]}"; do
              [ -f "$BUILD_FILE" ] || continue
              VERSION=$(grep -Eo 'JavaLanguageVersion\.of\([0-9]+\)' "$BUILD_FILE" | head -1 | sed -E 's/[^0-9]//g' || true)
              VERSION=${VERSION:-$(grep -Eo "(source|target)Compatibility[[:space:]]*=[[:space:]]*['\"]?[0-9]+(\.[0-9]+)?['\"]?" "$BUILD_FILE" | head -1 | sed -E 's/[^0-9.]//g' || true)}
              VERSION=${VERSION:-$(grep -Eo 'JavaVersion\.VERSION_[0-9]+(_[0-9]+)?' "$BUILD_FILE" | head -1 | sed -E 's/JavaVersion\.VERSION_//; s/_/./g' || true)}
              VERSION=${VERSION#1.}
              [ -z "$VERSION" ] || break
            done
          fi
          if [ -z "$VERSION" ]; then
            echo 'Could not detect Java version; provide the java-version input' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using Java version: $VERSION"

      - name: Set up JDK ${{ steps.java-info.outputs.version }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: ${{ steps.java-info.outputs.version }}
          distribution: "temurin"
          cache: "gradle"

      - name: Extract version from build.gradle
        id: version
        env:
          MODULE: ${{ inputs.module }}
        run: |
          chmod +x gradlew

          GRADLE_TASK="${MODULE:+:$MODULE:}properties"
          GRADLE_PROPERTIES=$(./gradlew "$GRADLE_TASK" -q --no-daemon)
          VERSION=$(awk '/^version:/ {print $2}' <<< "$GRADLE_PROPERTIES")

          if [ -z "$VERSION" ] || [ "$VERSION" = "unspecified" ]; then
            echo "❌ Error: Could not extract version from Gradle properties"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  policy:
    needs: metadata
    uses: ./.github/workflows/reusable-release-prepare.yaml
    with:
      version: ${{ needs.metadata.outputs.version }}
      tag-prefix: ${{ inputs.module }}

name: Reusable Python Docker Image

on:
  workflow_call:
    inputs:
      version:
        description: Project SemVer
        required: true
        type: string
      image:
        description: GHCR image name
        required: true
        type: string
      source-sha:
        description: Commit that must own the immutable image tag
        required: true
        type: string
      tag-exists:
        description: Whether the version Git tag already exists
        required: true
        type: string
    secrets:
      registry-password:
        description: GHCR password/token
        required: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.registry-password }}

      - name: Check immutable image
        id: state
        env:
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ inputs.image }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          TAG_EXISTS: ${{ inputs.tag-exists }}
        run: |
          if MANIFEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --raw 2>&1); then
            REVISION=$(jq -er '.annotations["org.opencontainers.image.revision"]' <<< "$MANIFEST")
            [ "$REVISION" = "$SOURCE_SHA" ] || {
              echo "Version $VERSION belongs to another commit; bump the version" >&2
              exit 1
            }
            IMAGE_EXISTS=true
          else
            if [ "$MANIFEST" != "ERROR: $IMAGE:$VERSION: not found" ] \
              && ! grep -qiE 'manifest unknown|no such manifest|manifest.*not found' <<< "$MANIFEST"; then
              echo "$MANIFEST" >&2
              exit 1
            fi
            [ "$TAG_EXISTS" = false ] || { echo 'Tagged release image is missing' >&2; exit 1; }
            IMAGE_EXISTS=false
          fi
          echo "image-exists=$IMAGE_EXISTS" >> "$GITHUB_OUTPUT"

      - name: Build and push version image
        if: steps.state.outputs.image-exists == 'false'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ inputs.image }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source-sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          annotations: |
            index:org.opencontainers.image.revision=${{ inputs.source-sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

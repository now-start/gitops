services:
  barosteel:
    image: ghcr.io/now-start/barosteel:0.2.4
    user: root
    stop_grace_period: 120s
    environment:
      TZ: Asia/Seoul
      THC_PORT: "8081"
      THC_PATH: /actuator/health/liveness
      SPRING_CONFIG_IMPORT: configserver:http://config:8888
    networks: [default, platform_default, grafana_default]
    healthcheck:
      test: ["CMD", "/workspace/health-check"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 120s
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 5m
      rollback_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
        monitor: 5m
      restart_policy:
        condition: any
        delay: 5s

networks:
  default:
    driver: overlay
    ipam:
      config:
        - subnet: 10.0.3.0/24
    driver_opts:
      com.docker.network.driver.mtu: "1200"
  platform_default:
    external: true
  grafana_default:
    external: true

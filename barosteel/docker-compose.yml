services:
  barosteel:
    # Publish an image containing this change before deployment.
    image: ghcr.io/now-start/barosteel:0.1.22
    user: root
    environment:
      TZ: Asia/Seoul
      SPRING_CONFIG_IMPORT: configserver:http://config:8888
    networks: [default, platform_default, grafana_default]
    # Requires a newly published image with the Paketo health-checker buildpack.
    healthcheck:
      test: ["CMD", "/cnb/lifecycle/launcher", "--", "/workspace/health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 5m
      rollback_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
        monitor: 5m
      restart_policy:
        condition: any
        delay: 5s

networks:
  default:
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: "1200"
  platform_default:
    external: true
  grafana_default:
    external: true

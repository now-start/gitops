x-deploy-defaults: &deploy-defaults
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
    monitor: 5m
    delay: 10s
  rollback_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
    monitor: 5m
    delay: 10s
  restart_policy:
    condition: any
    delay: 5s

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 5m

x-service-defaults: &service-defaults
  stop_grace_period: 5m

services:
  barosteel:
    image: ghcr.io/now-start/barosteel:0.2.11
    user: root
    <<: *service-defaults
    environment:
      TZ: Asia/Seoul
      THC_PORT: "8081"
      THC_PATH: /actuator/health/readiness
      SPRING_CONFIG_IMPORT: configserver:http://config:8888
    networks: [default, platform_default, grafana_default]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/workspace/health-check"]
    deploy:
      <<: *deploy-defaults
      mode: replicated
      replicas: 2
      endpoint_mode: vip

networks:
  default:
    driver: overlay
    ipam:
      config:
        - subnet: 10.0.3.0/24
    driver_opts:
      com.docker.network.driver.mtu: "1200"
  platform_default:
    external: true
  grafana_default:
    external: true

services:
  grafana:
    image: grafana/otel-lgtm:0.34.0
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: ingress
    environment:
      TZ: Asia/Seoul
      ENABLE_LOGS_GRAFANA: "true"
      #GF_PLUGINS_PREINSTALL: grafana-lokiexplore-app,grafana-metricsdrilldown-app,grafana-exploretraces-app,grafana-pyroscope-app
      GF_USERS_DEFAULT_LANGUAGE: ko-KR
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_ROOT_URL: https://grafana.nowstart.org
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: SSO
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "f39157fa414e14e8edc6c8ce140c7886"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid groups email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://sso.nowstart.org/webman/sso/SSOOauth.cgi
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://sso.nowstart.org/webman/sso/SSOAccessToken.cgi
      GF_AUTH_GENERIC_OAUTH_API_URL: https://sso.nowstart.org/webman/sso/SSOUserInfo.cgi
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'administrators') && 'GrafanaAdmin' || 'Viewer'"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mail.nowstart.org:587
      GF_SMTP_USER: phantom2691
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: no-reply@nowstart.org
    volumes:
      - grafana_data:/data
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 3m
      rollback_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
        monitor: 3m
      restart_policy:
        condition: any
        delay: 5s

networks:
  default:
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: "1200"

volumes:
  grafana_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=100.100.1.1,vers=4,hard
      device: :/volume1/docker/grafana

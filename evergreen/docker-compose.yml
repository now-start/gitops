x-deploy-defaults: &deploy-defaults
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
    monitor: 5m
    delay: 10s
  rollback_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
    monitor: 5m
    delay: 10s
  restart_policy:
    condition: any
    delay: 5s

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 5m

x-service-defaults: &service-defaults
  stop_grace_period: 5m
  user: root
  environment: &environment-defaults
    TZ: Asia/Seoul
    SPRING_CONFIG_IMPORT: configserver:http://config:8888
  networks:
    - platform_default
    - grafana_default
  deploy:
    <<: *deploy-defaults

services:
  lotto:
    <<: *service-defaults
    deploy:
      <<: *deploy-defaults
      replicas: 1
    image: ghcr.io/now-start/lotto-service:9.4.4
    environment:
      <<: *environment-defaults
      THC_PORT: "8081"
      THC_PATH: /actuator/health/readiness
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "/workspace/health-check"]

  coin:
    <<: *service-defaults
    image: ghcr.io/now-start/evergreen:2.2.7
    deploy:
      <<: *deploy-defaults
      replicas: 1
      placement:
        constraints:
          - node.hostname == NOW_START

networks:
  platform_default:
    external: true
  grafana_default:
    external: true

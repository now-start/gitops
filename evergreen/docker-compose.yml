x-deploy-defaults: &deploy-defaults
  replicas: 1
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
    monitor: 5m
  rollback_config:
    parallelism: 1
    order: stop-first
    failure_action: pause
    monitor: 5m
  restart_policy:
    condition: any
    delay: 5s

x-service-defaults: &service-defaults
  user: root
  environment: &environment-defaults
    TZ: Asia/Seoul
    SPRING_CONFIG_IMPORT: configserver:http://config:8888
  networks:
    - platform_default
    - grafana_default
  deploy:
    <<: *deploy-defaults

services:
  lotto:
    <<: *service-defaults
    image: ghcr.io/now-start/lotto-service:9.4.4
    stop_grace_period: 120s
    environment:
      <<: *environment-defaults
      THC_PORT: "8081"
      THC_PATH: /actuator/health/liveness
    healthcheck:
      test: ["CMD", "/workspace/health-check"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 300s

  coin:
    <<: *service-defaults
    image: ghcr.io/now-start/evergreen:2.2.7
    deploy:
      <<: *deploy-defaults
      placement:
        constraints:
          - node.hostname == NOW_START

networks:
  platform_default:
    external: true
  grafana_default:
    external: true
